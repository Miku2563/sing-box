name: Build Windows Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
      legacy_win7:
        description: "Also build Windows 7 legacy binaries"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, naive: true }
          - { arch: "386" }
          - { arch: arm64, naive: true }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Patch Go for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        run: .github/patch_go_for_windows_arm64.sh
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-windows-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-windows-
      - name: Set tag
        run: git tag v${{ inputs.version }} -f
      - name: Build
        run: |
          if ("${{ matrix.naive }}" -eq "true") {
            $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS
          } else {
            $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_OTHERS
          }
          $LDFLAGS_SHARED = Get-Content release/LDFLAGS
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ inputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" `
          ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract libcronet.dll
        if: matrix.naive
        run: |
          $CRONET_GO_VERSION = Get-Content .github/CRONET_GO_VERSION
          $LIBRARY_PATH = "lib/windows_${{ matrix.arch }}/libcronet.dll"
          git init "$env:RUNNER_TEMP/cronet-go-lib"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$env:RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          Copy-Item "$env:RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist
      - name: Archive
        run: |
          $DIR_NAME = "sing-box-${{ inputs.version }}-windows-${{ matrix.arch }}"
          mkdir "dist/$DIR_NAME"
          Copy-Item LICENSE "dist/$DIR_NAME"
          Copy-Item "dist/sing-box.exe" "dist/$DIR_NAME"
          if (Test-Path "dist/libcronet.dll") {
            Copy-Item "dist/libcronet.dll" "dist/$DIR_NAME"
          }
          Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
          Remove-Item -Recurse "dist/$DIR_NAME"
          Remove-Item -Force dist/sing-box.exe
          Remove-Item -Force dist/libcronet.dll -ErrorAction SilentlyContinue
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows_${{ matrix.arch }}
          path: dist

  build_windows_legacy:
    name: Build Windows 7 legacy (${{ matrix.arch }})
    if: inputs.legacy_win7
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Cache Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-linux-
      - name: Cache Go for Windows 7
        id: cache-go-for-windows7
        uses: actions/cache@v4
        with:
          path: ~/go/go_win7
          key: go_win7_12610
      - name: Setup Go for Windows 7
        if: steps.cache-go-for-windows7.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/setup_go_for_windows7.sh
      - name: Use Windows 7 Go
        run: |
          echo "PATH=$HOME/go/go_win7/bin:$PATH" >> $GITHUB_ENV
          echo "GOROOT=$HOME/go/go_win7" >> $GITHUB_ENV
      - name: Set tag
        run: git tag v${{ inputs.version }} -f
      - name: Build
        run: |
          set -xeuo pipefail
          TAGS=$(sed 's/,with_usbip//' release/DEFAULT_BUILD_TAGS_OTHERS)
          LDFLAGS_SHARED=$(cat release/LDFLAGS)
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ inputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
          ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ inputs.version }}-windows-${{ matrix.arch }}-legacy-windows-7"
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}/sing-box.exe"
          zip -r "${DIR_NAME}.zip" "${DIR_NAME}"
          rm -r "${DIR_NAME}" sing-box
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows_${{ matrix.arch }}-legacy-windows-7
          path: dist
